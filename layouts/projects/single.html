{{ define "main" }}
<article class="wrap">
  <p class="eyebrow">{{ .Params.descriptor }}</p>
  <h1>{{ .Title }}</h1>

  <h2>{{ i18n "section_role" }}</h2>
  <div class="scroll-x">
    <table class="meta-table">
      <tr><th>Vai trò</th><td>{{ .Params.role }}</td></tr>
      <tr><th>Thời gian</th><td>{{ .Params.period }}</td></tr>
      <tr><th>Phạm vi</th><td>{{ .Params.scale }}</td></tr>
      <tr><th>Nền tảng kỹ thuật</th><td class="mono">{{ delimit .Params.stack " · " }}</td></tr>
    </table>
  </div>

  {{ .Content }}

  {{ with .Params.diagram }}
  <figure>
    <div class="scroll-x">{{ readFile (printf "static/diagrams/%s.svg" .) | safeHTML }}</div>
    <figcaption>Sơ đồ kiến trúc, đã lược bỏ chi tiết định danh hệ thống.</figcaption>
  </figure>
  {{ end }}
</article>
{{ end }}
